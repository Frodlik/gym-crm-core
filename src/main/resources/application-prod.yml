spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    drop-first: false
    contexts: production,default
    default-schema: ${DB_SCHEMA:gym_crm}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.gym.crm: INFO
    root: WARN
  file:
    name: /var/log/gym-crm/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 60

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20

security:
  brute-force:
    max-attempts: 3
    block-duration-minutes: 5